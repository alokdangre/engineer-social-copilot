[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "social-media-manager"
version = "0.1.0"
description = "Human-reviewed AI social media and career manager for technical professionals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21",
  "alembic>=1.16",
  "argon2-cffi>=23.1",
  "cryptography>=45",
  "email-validator>=2.2",
  "fastapi>=0.116",
  "httpx>=0.28",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "opentelemetry-api>=1.36",
  "opentelemetry-exporter-otlp>=1.36",
  "opentelemetry-instrumentation-fastapi>=0.57b0",
  "opentelemetry-instrumentation-httpx>=0.57b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0",
  "opentelemetry-sdk>=1.36",
  "pgvector>=0.4",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "respx>=0.22",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_manager"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["social_manager"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "pgvector.*"]
ignore_missing_imports = true
