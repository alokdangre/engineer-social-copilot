services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social-media-manager-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: social_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

