services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social-media-manager-postgres
    environment:
      POSTGRES_DB: social_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ENV: development
      APP_SECRET_KEY: local-compose-secret-change-before-production
      DATABASE_URL: postgresql+psycopg://social_manager:social_manager@postgres:5432/social_manager
      CHECKPOINT_DATABASE_URL: postgresql://social_manager:social_manager@postgres:5432/social_manager?sslmode=disable
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

